packages:
  - 'packages/*'

overrides:
  # Security patches for the pinned DSH compatibility assembly.
  'fast-uri@>=3.0.0 <3.1.8': 3.1.8
  'undici@>=8.0.0 <8.10.2': 8.10.2
  'ip-address@>=10.0.0 <10.7.1': 10.7.1
  'hono@<4.13.7': 4.13.7
  'http-cache-semantics@<=4.2.0': 4.3.0
  'source-map-js@>=1.0.0 <1.2.2': 1.2.2
  'proxy-addr@>=1.1.0 <2.0.8': 2.0.8
  'compression@<1.8.2': 1.8.2
  # micromark 的数学渲染使用修复 trust 继承问题的 KaTeX 版本。
  'micromark-extension-math@3.1.0>katex': 0.18.2
  'qs@<6.16.0': 6.16.0
  'js-yaml@>=4.0.0 <4.3.2': 4.3.2
  '@deepseek-ai/dsh-attachment-local@0.2.0-rc.2>sharp': 0.35.5
  '@modelcontextprotocol/client@>=2.0.0 <2.2.0': 2.2.0
  '@modelcontextprotocol/sdk@>=1.12.0 <1.31.0': 1.31.0
  # 保持 MCP 安全补丁兼容的现有传输与限流依赖版本。
  '@modelcontextprotocol/sdk@1.31.0>@hono/node-server': 2.1.1
  '@modelcontextprotocol/sdk@1.31.0>express-rate-limit': 8.6.2
  # libreoffice-kit pins a release affected by GHSA-px8p-9vwx-vf98.
  '@deepseek-ai/libreoffice-kit@0.1.2>fflate': 0.8.3
  '@deepseek-ai/cordis-plugin-group': 1.0.2
  '@deepseek-ai/dsh-anonymous-user-id': 0.2.0-rc.2
  '@deepseek-ai/dsh-atomic-write': 0.2.0-rc.2
  '@deepseek-ai/dsh-attachment': 0.2.0-rc.2
  '@deepseek-ai/dsh-authorization': 0.2.0-rc.2
  '@deepseek-ai/dsh-bash-local': 0.2.0-rc.2
  '@deepseek-ai/dsh-code-runtime': 0.2.0-rc.2
  '@deepseek-ai/dsh-compaction': 0.2.0-rc.2
  '@deepseek-ai/dsh-fs': 0.2.0-rc.2
  '@deepseek-ai/dsh-hook-protocol': 0.2.0-rc.2
  '@deepseek-ai/dsh-invariants': 0.2.0-rc.2
  '@deepseek-ai/dsh-jobs': 0.2.0-rc.2
  '@deepseek-ai/dsh-ptc-runtime': 0.2.0-rc.2
  '@deepseek-ai/dsh-output-retention': 0.2.0-rc.2
  '@deepseek-ai/dsh-sandbox': 0.2.0-rc.2
  '@deepseek-ai/dsh-sandbox-policy': 0.2.0-rc.2
  '@deepseek-ai/dsh-sdk-protocol': 0.2.0-rc.2
  '@deepseek-ai/dsh-session-persistence': 0.2.0-rc.2
  '@deepseek-ai/dsh-session-query': 0.2.0-rc.2
  '@deepseek-ai/dsh-session-telemetry': 0.2.0-rc.2
  '@deepseek-ai/dsh-session-title-llm': 0.2.0-rc.2
  '@deepseek-ai/dsh-shell': 0.2.0-rc.2
  '@deepseek-ai/dsh-spill': 0.2.0-rc.2
  '@deepseek-ai/dsh-subagent-in-process-driver': 0.2.0-rc.2
  '@deepseek-ai/dsh-typert-protocol': 0.2.0-rc.2
  '@deepseek-ai/dsh-util-time': 0.2.0-rc.2
  '@deepseek-ai/dsh-util-workspace-path': 0.2.0-rc.2
  '@deepseek-ai/dsh-workflow': 0.2.0-rc.2

minimumReleaseAgeExclude:
  # Compatibility testing intentionally follows freshly published DSH releases.
  - '@deepseek-ai/*'

allowBuilds:
  '@deepseek-ai/dsh-subprocess-local': true
  '@google/genai': true
  koffi: true
  node-pty: true
  protobufjs: true
